# TSVRA example configuration file

# Number of layers (default: 2)
num_layers = 2

# Grid factor (grid size = 4 * grid_factor, default: 4)
grid_factor = 4

# Failure mode: a = initial failures only, b = runtime failures only, c = mixed failures (default: a)
failure_mode = c

# Compatibility parameter: sets both the initial failure probability and the per-cycle conditional runtime failure probability
# When initial_failure_rate and runtime_failure_rate are set separately, those values take precedence
failure_rate = 1e-9

# initial_failure_rate = 1e-9
# runtime_failure_rate = 1e-9

# Spatial distribution: uniform or hotspot. Hotspots are fixed on the specified inter-layer interface after initialization
failure_model = uniform
hotspot_count = 1
hotspot_radius = 4.0
hotspot_multiplier = 5.0
# Manual centers use the lower-layer z (0 <= z < num_layers - 1). Separate multiple centers with semicolons
# hotspot_centers = 4,4,0;12,12,0

# Vertical transmission delay (default: 1)
vertical_delay = 1

# Horizontal transmission delay (default: 1000)
horizontal_delay = 1000

# Routing delay per actual hop, including extra hops added by detours (default: 15 cycles)
router_delay = 15

# Probability of generating a request each cycle (default: 0.5)
request_probability = 0.5

# Power-model parameter file
power_config = code/config/power_model.ini

# Number of simulation cycles (default: 10^7)
simulation_cycles = 10000000

# Output file prefix (default: code/output/tsvra_output)
output_prefix = code/output/tsvra_output

# Random seed (0 uses a random device, default: 0)
random_seed = 0

# Congestion weight λ1 (default: 0.0; 0 disables congestion-aware routing)
# lambda1 = 0.0

# Risk weight λ2 (default: 0.0; 0 disables risk-aware routing)
# lambda2 = 0.0

# Maximum path length L_max in hops (default: 0; 0 means unlimited)
# max_path_length = 0

# Minimum path reliability R_min (default: 0.0; 0 means unconstrained)
# reliability_min = 0.0
