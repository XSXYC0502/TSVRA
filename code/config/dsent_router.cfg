# TSVRA reference router for offline DSENT 0.9 calibration.
# Upstream: mit-carbon/Graphite, commit 1b4bb98f5bfb96ca394b71e7ef3e9e500a1e3997.
# Bulk45LVT is the shipped bulk CMOS model (1 V, 340 K); it is not SOI45.
# 8 virtual channels * 2 buffers/VC = 16 buffers per input port.
ModelName = Router
ElectricalTechModelFilename = tech/tech_models/Bulk45LVT.model
IsPerformTimingOptimization = true
TimingOptimization->StartNetNames = [*]
Frequency = 1e9
InjectionRate = 0
NumberInputPorts = 6
NumberOutputPorts = 6
NumberBitsPerFlit = 64
NumberVirtualNetworks = 1
NumberVirtualChannelsPerVirtualNetwork = [8]
NumberBuffersPerVirtualChannel = [2]
InputPort->BufferModel = DFFRAM
CrossbarModel = MultiplexerCrossbar
SwitchAllocator->ArbiterModel = MatrixArbiter
ClockTreeModel = BroadcastHTree
ClockTree->NumberLevels = 5
ClockTree->WireLayer = Global
ClockTree->WireWidthMultiplier = 1.0

QueryString = \
    Energy>>Router:WriteBuffer@0 \
    Energy>>Router:ReadBuffer@0 \
    Energy>>Router:TraverseCrossbar->Multicast1@0 \
    Energy>>Router:ArbitrateSwitch->ArbitrateStage1@0 \
    Energy>>Router:ArbitrateSwitch->ArbitrateStage2@0 \
    Energy>>Router:DistributeClock@0 \
    NddPower>>Router:Leakage@0 \

# Prefixes are stable parser labels. DSENT uses W and J internally.
EvaluateString = \
    event_rate = $(NumberInputPorts) * $(InjectionRate) * $(Frequency); \
    buffer_energy = $(Energy>>Router:ReadBuffer) + $(Energy>>Router:WriteBuffer); \
    crossbar_energy = $(Energy>>Router:TraverseCrossbar->Multicast1); \
    control_energy = $(Energy>>Router:ArbitrateSwitch->ArbitrateStage1) + $(Energy>>Router:ArbitrateSwitch->ArbitrateStage2); \
    clock_w = $(Energy>>Router:DistributeClock) * $(Frequency); \
    leakage_w = $(NddPower>>Router:Leakage); \
    print "tsvra_event_rate_hz=" event_rate; \
    print "tsvra_buffer_w=" buffer_energy * event_rate; \
    print "tsvra_crossbar_w=" crossbar_energy * event_rate; \
    print "tsvra_control_w=" control_energy * event_rate; \
    print "tsvra_clock_w=" clock_w; \
    print "tsvra_leakage_w=" leakage_w; \
    print "tsvra_total_w=" (buffer_energy + crossbar_energy + control_energy) * event_rate + clock_w + leakage_w; \
